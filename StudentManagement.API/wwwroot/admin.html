<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Dashboard - Unit University SIMS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css?v=20">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo-wrap">
                    <img src="images/UIT Unit University Logo.png" alt="UIT Logo" style="height:46px;">
                </div>
            </div>
            <nav class="sidebar-menu" id="sidebarMenu"></nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="topbar-search">
                    <i data-lucide="search"></i>
                    <input type="text" id="globalSearch" placeholder="Search students, lecturers, classes...">
                </div>
                <div class="topbar-user">
                    <span class="role-badge" id="userRoleBadge">Administrator</span>
                    <strong id="userNameDisplay" style="font-size: 13.5px;">Admin</strong>
                    <button class="btn-logout" id="btnLogout"><i data-lucide="log-out" style="width:14px;height:14px;"></i> Sign Out</button>
                </div>
            </header>
            <main class="content-body" id="mainContent"></main>
        </div>
    </div>
    <div class="modal-backdrop" id="appModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Action</h3>
                <button id="btnCloseModal" style="border:none; background:none; color:#94a3b8; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>
    <script src="js/app.js?v=2026"></script>
    <script src="js/admin.js?v=2026"></script>
    <script>
                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', function () {
                        navigator.serviceWorker.register('/sw.js').catch(function () {});
                    });
                }
    </script>
    <script>
                (function () {
                    var BREAKPOINT = 1024;
                    function initMobileSidebar() {
                        var sidebar = document.querySelector('.sidebar');
                        var topbar = document.querySelector('.topbar');
                        if (!sidebar || !topbar) return;

                        var backdrop = document.querySelector('.sidebar-backdrop');
                        if (!backdrop) {
                            backdrop = document.createElement('div');
                            backdrop.className = 'sidebar-backdrop';
                            document.body.appendChild(backdrop);
                        }

                        var btn = document.getElementById('btnMobileMenu');
                        if (!btn) {
                            var createdBtn = document.createElement('button');
                            createdBtn.setAttribute('type', 'button');
                            createdBtn.id = 'btnMobileMenu';
                            createdBtn.className = 'btn-mobile-menu';
                            createdBtn.setAttribute('aria-label', 'Open menu');
                            createdBtn.innerHTML = '<i data-lucide="menu" style="width:20px;height:20px;"></i>';
                            topbar.insertBefore(createdBtn, topbar.firstChild);
                            btn = createdBtn;

                            var lucideObj = typeof Reflect !== 'undefined' ? Reflect.get(window, 'lucide') : null;
                            if (lucideObj && typeof lucideObj.createIcons === 'function') {
                                lucideObj.createIcons();
                            }
                        }

                        function closeMenu() {
                            if (!sidebar || !backdrop) return;
                            sidebar.classList.remove('mobile-open');
                            backdrop.classList.remove('open');
                        }

                        function toggleMenu() {
                            if (!sidebar || !backdrop) return;
                            var ev = typeof Reflect !== 'undefined' ? Reflect.get(window, 'event') : null;
                            if (ev && typeof ev.stopPropagation === 'function') {
                                ev.stopPropagation();
                            }
                            var isOpen = sidebar.classList.toggle('mobile-open');
                            backdrop.classList.toggle('open', isOpen);
                        }

                        btn.addEventListener('click', toggleMenu);
                        backdrop.addEventListener('click', closeMenu);

                        sidebar.addEventListener('click', function () {
                            var ev = typeof Reflect !== 'undefined' ? Reflect.get(window, 'event') : null;
                            var target = ev ? ev.target : null;
                            if (target && target instanceof Element && target.closest('.menu-item, a, button') && window.innerWidth <= BREAKPOINT) {
                                closeMenu();
                            }
                        });

                        window.addEventListener('resize', function () {
                            if (window.innerWidth > BREAKPOINT) closeMenu();
                        });
                    }

                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', initMobileSidebar);
                    } else {
                        initMobileSidebar();
                    }
                })();
    </script>
</body>
</html>
