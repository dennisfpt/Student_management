<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign In - Unit University SIMS</title>
    <link rel="stylesheet" href="css/style.css?v=18">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --navy: #020B2D;
            --background: #06143A;
            --card: #0B1E49;
            --blue: #0878FF;
            --cyan: #00D9FF;
            --purple: #8055F6;
            --white: #F4F7FF;
        }

        .hero-section {
            min-height: 100vh;
            width: 100%;
            background-color: var(--navy);
            background-image: radial-gradient(circle at 50% 45%, rgba(0, 217, 255, 0.12) 0%, rgba(2, 11, 45, 0.72) 65%, rgba(2, 11, 45, 0.88) 100%), url('images/login-campus-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .neon-button {
            background: linear-gradient( 100deg, #0878FF, #00CFFF, #8055F6 );
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.5), 0 0 30px rgba(128, 85, 246, 0.3);
            border-radius: 14px;
            color: white;
            border: 1px solid rgba(0, 217, 255, 0.45);
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.2s ease, transform 0.2s ease;
        }

            .neon-button:hover {
                filter: brightness(1.08);
                transform: translateY(-1px);
            }

        .uit-top-lang {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(11, 30, 73, 0.72);
            border: 1px solid rgba(0, 217, 255, 0.28);
            backdrop-filter: blur(12px);
            color: var(--white);
            font-size: 12px;
        }

            .uit-top-lang select {
                background: transparent;
                border: none;
                color: var(--white);
                font-size: 12px;
                outline: none;
                cursor: pointer;
            }

        .uit-center-wrap {
            flex: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
        }

        .uit-glow-card {
            width: 100%;
            max-width: 440px;
            padding: 28px 32px 24px;
            border-radius: 26px;
            background: linear-gradient( 160deg, rgba(11, 30, 73, 0.86) 0%, rgba(6, 20, 58, 0.92) 55%, rgba(2, 11, 45, 0.94) 100% );
            backdrop-filter: blur(22px);
            border: 1.5px solid rgba(0, 217, 255, 0.45);
            box-shadow: 0 0 28px rgba(0, 217, 255, 0.24), 0 0 56px rgba(128, 85, 246, 0.16), inset 0 0 20px rgba(0, 217, 255, 0.06);
        }

        .uit-brand-img-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .uit-brand-plate {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 16px;
            background: rgba(244, 247, 255, 0.94);
            border: 1.5px solid rgba(0, 217, 255, 0.75);
            box-shadow: 0 0 24px rgba(0, 217, 255, 0.45);
        }

            .uit-brand-plate img {
                height: 54px;
                width: auto;
                max-width: 260px;
                object-fit: contain;
                display: block;
            }

        .uit-signin-heading {
            text-align: center;
            margin-bottom: 18px;
        }

            .uit-signin-heading h2 {
                font-size: 28px;
                font-weight: 800;
                color: var(--white);
                margin-bottom: 4px;
            }

            .uit-signin-heading p {
                font-size: 13px;
                color: #94a3b8;
            }

        .uit-role-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(2, 11, 45, 0.72);
            padding: 4px;
            border-radius: 13px;
            border: 1px solid rgba(0, 217, 255, 0.2);
            margin-bottom: 18px;
        }

            .uit-role-bar .role-tab {
                border-radius: 10px;
                padding: 8px 10px;
                font-size: 12.5px;
                font-weight: 600;
                color: #cbd5e1;
                background: transparent;
                border: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                cursor: pointer;
                transition: 0.2s;
            }

                .uit-role-bar .role-tab.active {
                    background: linear-gradient(100deg, var(--blue), var(--cyan), var(--purple));
                    color: var(--white);
                    box-shadow: 0 0 16px rgba(0, 217, 255, 0.45);
                }

        .uit-field {
            margin-bottom: 14px;
        }

        .uit-field-label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 7px;
        }

        .uit-input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .uit-left-ico {
            position: absolute;
            left: 13px;
            width: 15px;
            height: 15px;
            color: #64748b;
            pointer-events: none;
        }

        .uit-field-input {
            width: 100%;
            padding: 11px 40px 11px 38px;
            border-radius: 12px;
            border: 1px solid rgba(0, 217, 255, 0.22);
            background: rgba(6, 20, 58, 0.78);
            color: var(--white);
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

            .uit-field-input::placeholder {
                color: #64748b;
            }

            .uit-field-input:focus {
                border-color: var(--cyan);
                box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.16);
            }

        .uit-toggle-eye {
            position: absolute;
            right: 11px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: inline-flex;
            align-items: center;
        }

        .uit-submit-btn {
            width: 100%;
            padding: 12px 16px;
            font-size: 14.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .uit-or-line {
            position: relative;
            text-align: center;
            margin: 14px 0;
            font-size: 12px;
            color: #94a3b8;
        }

            .uit-or-line::before {
                content: "";
                position: absolute;
                top: 50%;
                left: 0;
                right: 0;
                height: 1px;
                background: rgba(148, 163, 184, 0.2);
            }

            .uit-or-line span {
                position: relative;
                background: rgba(6, 20, 58, 0.96);
                padding: 0 12px;
            }

        .uit-google-btn {
            width: 100%;
            padding: 10.5px 16px;
            border-radius: 12px;
            border: none;
            background: var(--white);
            color: var(--navy);
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .uit-signup-note {
            text-align: center;
            margin-top: 14px;
            font-size: 12.5px;
            color: #94a3b8;
        }

            .uit-signup-note a {
                color: var(--cyan);
                font-weight: 700;
                text-decoration: none;
            }

        .uit-quick-panel {
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(2, 11, 45, 0.72);
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .uit-quick-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 5px;
        }

        .uit-quick-items {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            color: #94a3b8;
        }

        .uit-quick-btn {
            cursor: pointer;
            color: #cbd5e1;
            padding: 2px 5px;
            border-radius: 6px;
        }

            .uit-quick-btn:hover {
                color: var(--cyan);
                background: rgba(0, 217, 255, 0.12);
            }
    </style>
</head>
<body class="hero-section">
    <div class="uit-top-lang">
        <i data-lucide="globe" style="width:14px;height:14px;"></i>
        <select id="uitLangSelect" aria-label="Language">
            <option value="en" selected>English</option>
            <option value="vi">Tiếng Việt</option>
        </select>
    </div>

    <div class="uit-center-wrap">
        <div class="uit-glow-card">
            <div class="uit-brand-img-wrap">
                <div class="uit-brand-plate">
                    <img src="images/UIT Unit University Logo.png" alt="UIT Unit University">
                </div>
            </div>

            <div class="uit-signin-heading">
                <h2>Sign In</h2>
                <p>Access your account to continue</p>
            </div>

            <div class="role-tabs uit-role-bar">
                <button type="button" class="role-tab active" data-role="Student"><i data-lucide="user" style="width:13px;height:13px;"></i> Student</button>
                <button type="button" class="role-tab" data-role="Teacher"><i data-lucide="graduation-cap" style="width:13px;height:13px;"></i> Lecturer</button>
                <button type="button" class="role-tab" data-role="Admin"><i data-lucide="shield" style="width:13px;height:13px;"></i> Admin</button>
            </div>

            <form id="loginForm">
                <div class="uit-field">
                    <label class="uit-field-label" id="emailLabel">
                        <i data-lucide="mail" style="width:14px;height:14px;color:#94a3b8;"></i>
                        <span>Student Email</span>
                    </label>
                    <div class="uit-input-box">
                        <i data-lucide="minus" class="uit-left-ico"></i>
                        <input type="email" id="emailInput" class="uit-field-input" placeholder="Enter your student email" required>
                    </div>
                </div>

                <div class="uit-field">
                    <label class="uit-field-label">
                        <i data-lucide="lock" style="width:14px;height:14px;color:#94a3b8;"></i>
                        <span>Password</span>
                    </label>
                    <div class="uit-input-box">
                        <i data-lucide="minus" class="uit-left-ico"></i>
                        <input type="password" id="passwordInput" class="uit-field-input" placeholder="Enter your password" required>
                        <button type="button" class="uit-toggle-eye" id="btnTogglePass" aria-label="Toggle password">
                            <i data-lucide="eye" style="width:16px;height:16px;"></i>
                        </button>
                    </div>
                </div>

                <p id="errorMsg" style="color: #f87171; font-size: 13px; margin-bottom: 12px; display: none;"></p>

                <button type="submit" class="neon-button uit-submit-btn">
                    <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
                    <span>Sign In</span>
                </button>
            </form>

            <div class="uit-or-line"><span>or continue with</span></div>

            <button type="button" class="uit-google-btn" id="btnGoogleLogin">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" alt="Google">
                <span>Continue with Google</span>
            </button>

            <p class="uit-signup-note">
                Don't have an account? <a href="register.html">Sign up</a>
            </p>

            <div class="uit-quick-panel">
                <div class="uit-quick-title">
                    <i data-lucide="zap" style="width:13px;height:13px;color:#fbbf24;"></i>
                    <span>Quick Access</span>
                </div>
                <div class="uit-quick-items">
                    <span class="demo-account-item uit-quick-btn" data-email="an.nv@unit.edu.vn" data-pass="Student@123" data-role="Student">Dashboard</span>
                    <span>•</span>
                    <span class="demo-account-item uit-quick-btn" data-email="minh.tv@unit.edu.vn" data-pass="Teacher@123" data-role="Teacher">Academic Records</span>
                    <span>•</span>
                    <span class="demo-account-item uit-quick-btn" data-email="admin@unit.edu.vn" data-pass="Admin@123" data-role="Admin">Schedule</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js?v=18"></script>
    <script>
                document.getElementById('btnTogglePass')?.addEventListener('click', () => {
                    const inp = document.getElementById('passwordInput');
                    if (inp instanceof HTMLInputElement) {
                        inp.type = inp.type === 'password' ? 'text' : 'password';
                    }
                });
                document.getElementById('btnGoogleLogin')?.addEventListener('click', () => {
                    alert('Please sign in with your university email and password.');
                });
    </script>
</body>
</html>
